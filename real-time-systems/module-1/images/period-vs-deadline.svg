<g class="release"><path d="M80 140V245 M370 140V245 M660 140V245 M950 140V245"/></g>
<g class="deadline"><path d="M254 140V245 M544 140V245 M834 140V245"/></g>
<g class="small" text-anchor="middle"><text x="80" y="273">0 ms</text><text x="370" y="273">20 ms</text><text x="660" y="273">40 ms</text><text x="950" y="273">60 ms</text><text x="167" y="127">Deadline at 12 ms</text><text x="457" y="127">Deadline at 32 ms</text><text x="747" y="127">Deadline at 52 ms</text></g>
<g stroke="#263747" stroke-width="2" fill="none"><path d="M80 298V310H370V298"/><path d="M370 298V310H660V298"/></g>
